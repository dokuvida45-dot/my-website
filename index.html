<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy New Year 🎉</title>

    <!-- Tailwind (no install needed) -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 via-fuchsia-600 to-amber-500 p-6">
    <main class="w-full max-w-lg">
      <section class="relative overflow-hidden rounded-3xl bg-white/90 backdrop-blur shadow-2xl p-8">
        <div class="absolute -top-16 -right-16 h-44 w-44 rounded-full bg-fuchsia-200/60"></div>
        <div class="absolute -bottom-16 -left-16 h-44 w-44 rounded-full bg-amber-200/60"></div>

        <p class="text-sm font-semibold text-indigo-700">A little message from</p>
        <h1 class="mt-1 text-3xl sm:text-4xl font-extrabold tracking-tight text-gray-900">
          vivi dear
        </h1>

        <div class="mt-6 rounded-2xl bg-gradient-to-r from-indigo-600 to-fuchsia-600 p-[2px]">
          <div class="rounded-2xl bg-white p-6">
            <h2 class="text-2xl font-bold text-gray-900">Happy New Year! 🎆</h2>
            <p class="mt-3 text-gray-700 leading-relaxed">
              Wishing you a joyful New Year and a successful year ahead. May your goals work out,
              your days stay bright, and your heart stay at peace.
            </p>

            <button
              id="shareBtn"
              class="mt-6 w-full rounded-xl bg-gray-900 px-5 py-3 text-white font-semibold shadow hover:bg-gray-800 active:scale-[0.99] transition"
            >
              Tap to share this wish
            </button>

            <p id="status" class="mt-3 text-sm text-gray-600"></p>
          </div>
        </div>
      </section>

      <p class="mt-6 text-center text-white/90 text-sm">
        Tip: change colors by editing the “from-… via-… to-…” classes in the background.
      </p>
    </main>

    <script>
      const shareBtn = document.getElementById("shareBtn");
      const statusEl = document.getElementById("status");

      const message =
        "Happy New Year! 🎉 Wishing you a joyful New Year and a successful year ahead.";

      shareBtn.addEventListener("click", async () => {
        try {
          if (navigator.share) {
            await navigator.share({
              title: "Happy New Year 🎉",
              text: I-love-you-AbortController,
            });
            statusEl.textContent = "Shared ✅";
          } else {
            await navigator.clipboard.writeText(message);
            statusEl.textContent = "Copied ✅ (paste it into WhatsApp/SMS)";
          }
        } catch (e) {
          statusEl.textContent = "No worries — you can still screenshot and share it.";
        }
      });
    </script>
  </body>

</html>
